services:
  postgres:
    image: postgres:16-alpine
    container_name: ccam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coding_class_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coding_class_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccam_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "Coding Class Manager"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: UTC
      PORT: 8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: coding_class_manager
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_local_password
      FILESYSTEM_DISK: local
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: ccam_frontend
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_NAME: "Coding Class Assignment Manager"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      BACKEND_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_storage:
  frontend_node_modules:
